name: Deploy report to GitHub Pages

on:
  push:
    branches: [clean]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/clean'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Download website videos from Git LFS
        run: git lfs pull --include="dist/media/**" --exclude=""
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check website
        run: |
          npm ci
          npm run check
          npm run validate
      # The site's base path comes from Pages itself, so renaming or transferring the
      # repository (or adding a custom domain) needs no change here.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Prepare published files
        run: npm run build
        env:
          REPORT_BASE: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site-next
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
