name: Deploy report to GitHub Pages

on:
  push:
    branches: ['001']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/001'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Download website videos from Git LFS
        run: git lfs pull --include="dist/media/**" --exclude=""
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check website
        run: |
          npm run check
          npm run validate
      - name: Prepare published files
        run: node scripts/prepare-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
